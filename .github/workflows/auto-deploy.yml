name: Auto update CF-Navs (upstream -> worker nav)

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update-nav
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE: https://nav.mars1024.com
    steps:
      - name: Resolve latest upstream release
        id: rel
        run: |
          TAG=$(curl -sS -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/lbjxr/CF-Navs/releases/latest \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('tag_name',''))")
          [ -n "$TAG" ] || { echo "::error::无法解析上游最新 release"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "上游最新: $TAG"

      - name: Read currently deployed version
        id: cur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUR=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/.deployed-version?ref=${{ github.ref_name }}" 2>/dev/null | tr -d '\r\n' || true)
          echo "cur=$CUR" >> "$GITHUB_OUTPUT"
          echo "当前部署: ${CUR:-<未知>}"

      - name: Decide
        id: decide
        run: |
          if [ "${{ steps.cur.outputs.cur }}" = "${{ steps.rel.outputs.tag }}" ]; then
            echo "need=0" >> "$GITHUB_OUTPUT"; echo "已是最新，跳过。"
          else
            echo "need=1" >> "$GITHUB_OUTPUT"; echo "需要升级。"
          fi

      - uses: actions/checkout@v6
        if: steps.decide.outputs.need == '1'
        with:
          repository: lbjxr/CF-Navs
          ref: ${{ steps.rel.outputs.tag }}
          path: src

      - name: Pin worker name to nav
        if: steps.decide.outputs.need == '1'
        run: |
          cd src
          sed -i 's/^name = "cf-navs"/name = "nav"/' wrangler.toml
          grep -E '^name' wrangler.toml

      - uses: actions/setup-node@v6
        if: steps.decide.outputs.need == '1'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install
        if: steps.decide.outputs.need == '1'
        working-directory: src
        run: npm ci

      - name: Build
        if: steps.decide.outputs.need == '1'
        working-directory: src
        run: npm run build

      - name: Generate wrangler config
        if: steps.decide.outputs.need == '1'
        working-directory: src
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npm run setup:wrangler

      - name: Deploy
        if: steps.decide.outputs.need == '1'
        working-directory: src
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npm run wrangler -- deploy

      - name: Health check
        id: health
        if: steps.decide.outputs.need == '1'
        run: |
          ok=0
          for i in $(seq 1 12); do
            CODE=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' "$SITE/" || echo 000)
            echo "  第 $i 次: HTTP $CODE"
            if [ "$CODE" = "200" ]; then ok=1; break; fi
            sleep 10
          done
          VER=$(curl -sS -m 15 "$SITE/api/data/version" || echo '')
          echo "  /api/data/version: $VER"
          if [ "$ok" = "1" ] && echo "$VER" | grep -q '"code":0'; then
            echo "res=ok" >> "$GITHUB_OUTPUT"
          else
            echo "res=fail" >> "$GITHUB_OUTPUT"
            echo "::error::部署后健康检查未通过"
          fi

      - name: Rollback on failure
        if: steps.decide.outputs.need == '1' && steps.health.outputs.res == 'fail'
        working-directory: src
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          echo "健康检查失败，回滚到上一版本……"
          npm run wrangler -- rollback --yes || echo "::warning::自动回滚未成功，请人工检查"

      - name: Mark deployed version
        if: steps.decide.outputs.need == '1' && steps.health.outputs.res == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/.deployed-version?ref=${{ github.ref_name }}" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)
          BODY=$(printf '%s' "${{ steps.rel.outputs.tag }}" | base64 -w0)
          PAYLOAD="{\"message\":\"deployed ${{ steps.rel.outputs.tag }}\",\"content\":\"$BODY\",\"branch\":\"${{ github.ref_name }}\""
          [ -n "$SHA" ] && PAYLOAD="$PAYLOAD,\"sha\":\"$SHA\""
          PAYLOAD="$PAYLOAD}"
          curl -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/.deployed-version" -d "$PAYLOAD" >/dev/null
          echo "已记录 ${{ steps.rel.outputs.tag }}"

      - name: Heartbeat (keep the schedule alive)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          CUR=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/.heartbeat?ref=${{ github.ref_name }}" 2>/dev/null | tr -d '\r\n' || true)
          TODAY=$(date -u +%F)
          if [ -n "$CUR" ]; then
            LAST=$(date -u -d "$CUR" +%s 2>/dev/null || echo 0)
            NOW=$(date -u +%s)
            AGE=$(( (NOW - LAST) / 86400 ))
            if [ "$AGE" -lt 30 ]; then echo "心跳仍新鲜（${AGE} 天），跳过。"; exit 0; fi
          fi
          SHA=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/.heartbeat?ref=${{ github.ref_name }}" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)
          BODY=$(printf '%s' "$TODAY" | base64 -w0)
          PAYLOAD="{\"message\":\"heartbeat $TODAY\",\"content\":\"$BODY\",\"branch\":\"${{ github.ref_name }}\""
          [ -n "$SHA" ] && PAYLOAD="$PAYLOAD,\"sha\":\"$SHA\""
          PAYLOAD="$PAYLOAD}"
          curl -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/.heartbeat" -d "$PAYLOAD" >/dev/null
          echo "心跳已更新为 $TODAY"
