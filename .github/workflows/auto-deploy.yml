name: Auto update CF-Navs (upstream -> worker nav)

# 每天检查上游最新 release；有新版本就构建并部署到既有 Worker `nav`
# （自定义域名 nav.mars1024.com 绑在这个 Worker 上，名字必须保持 nav，否则域名会指向旧 Worker）
on:
  schedule:
    - cron: '23 4 * * *'      # 每天 04:23 UTC（北京 12:23）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update-nav
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve latest upstream release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(curl -sS -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/lbjxr/CF-Navs/releases/latest | python3 -c "import sys,json;print(json.load(sys.stdin).get('tag_name',''))")
          if [ -z "$TAG" ]; then echo "::error::未能解析上游最新 release"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "上游最新版本: $TAG"

      - name: Read currently deployed version
        id: cur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUR=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/.deployed-version?ref=${{ github.ref_name }}" 2>/dev/null | tr -d '\r\n' || true)
          echo "cur=$CUR" >> "$GITHUB_OUTPUT"
          echo "当前已部署: ${CUR:-<未知>}"

      - name: Skip if already latest
        if: steps.cur.outputs.cur == steps.rel.outputs.tag
        run: |
          echo "已是最新（${{ steps.rel.outputs.tag }}），跳过部署。"

      - name: Checkout upstream at release tag
        if: steps.cur.outputs.cur != steps.rel.outputs.tag
        uses: actions/checkout@v6
        with:
          repository: lbjxr/CF-Navs
          ref: ${{ steps.rel.outputs.tag }}
          path: src

      - name: Pin worker name to nav
        if: steps.cur.outputs.cur != steps.rel.outputs.tag
        run: |
          cd src
          sed -i 's/^name = "cf-navs"/name = "nav"/' wrangler.toml
          grep -E '^name' wrangler.toml

      - name: Setup Node
        if: steps.cur.outputs.cur != steps.rel.outputs.tag
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        if: steps.cur.outputs.cur != steps.rel.outputs.tag
        working-directory: src
        run: npm ci

      - name: Build
        if: steps.cur.outputs.cur != steps.rel.outputs.tag
        working-directory: src
        run: npm run build

      - name: Generate wrangler config (resolve D1 / KV ids)
        if: steps.cur.outputs.cur != steps.rel.outputs.tag
        working-directory: src
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npm run setup:wrangler

      - name: Deploy
        if: steps.cur.outputs.cur != steps.rel.outputs.tag
        working-directory: src
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npm run wrangler -- deploy

      - name: Record deployed version
        if: steps.cur.outputs.cur != steps.rel.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src
          SHA=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/.deployed-version?ref=${{ github.ref_name }}" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('sha',''))" 2>/dev/null || true)
          BODY=$(printf '%s' "${{ steps.rel.outputs.tag }}" | base64 -w0)
          if [ -n "$SHA" ]; then
            curl -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/.deployed-version" \
              -d "{\"message\":\"deployed ${{ steps.rel.outputs.tag }}\",\"content\":\"$BODY\",\"sha\":\"$SHA\",\"branch\":\"${{ github.ref_name }}\"}" >/dev/null
          else
            curl -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/.deployed-version" \
              -d "{\"message\":\"deployed ${{ steps.rel.outputs.tag }}\",\"content\":\"$BODY\",\"branch\":\"${{ github.ref_name }}\"}" >/dev/null
          fi
          echo "已记录部署版本 ${{ steps.rel.outputs.tag }}"
